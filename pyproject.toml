[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csg-conflichek"
version = "0.1.0"
description = "PHITS CSG overlap and undefined-region checker"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
dependencies = [
    "numpy==2.4.4",
    "scipy>=1.16",
]

[project.scripts]
csgc = "csg_conflichek.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.14",
]

[tool.hatch.build.targets.wheel]
packages = ["csg_conflichek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
